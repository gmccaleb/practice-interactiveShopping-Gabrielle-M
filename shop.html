<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styling.css">
</head>
<body>
    <header>
        <h1>Welcome to the Interactive Shopping List</h1>
    </header>
    
    <main>
        <!-- Input field items -->
        <form>
            <label for="items">Enter item here</label>
            <input type="text" id="item-input" name="item-input" placeholder="Item..." />
        </form>

        <button type="button" id="add-item-btn">Add item</button>
        <button type="button" id="rmv-item-btn">Remove item</button>
        <button type="button" id="edit-item-btn">Edit</button>

        <div id="list-items">
            <h2>Shopping List</h2>
            <ul>
                
            </ul>

        </div>
    </main>

    <footer>

    </footer>
</body>
</html>

Create a basic HTML structure with:

● A button to add items to the list.
